server {
    # 2026-08-21 改造:HTTPS listen 由 80 ssl 改为 443 ssl
    # 浏览器访问入口由 https://localhost:9001/ 变为 https://localhost:9000/
    # (docker-compose.yml web-agent 端口映射同步调整为 9000:443 + 9001:80 双入口)
    # HTTP 入口迁到下方独立 server 块 listen 80,对外 9001:80,与本块并存不互跳转
    listen 443 ssl;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ---- TLS 证书(mkcert 本地 CA,免浏览器警告)----
    # 证书由 ./nginx/mkcert.exe 签发,SAN 含 localhost / 127.0.0.1 / ::1 / 10.20.8.73(2026-08-12 新增 LAN IP)
    # 主机源文件在 ./web/Agent/certs/(与本 nginx.conf 同目录),通过 docker-compose volume bind 注入到容器
    # 容器内路径固定为 /etc/nginx/certs/(nginx 官方镜像的固定路径)
    # 重新签发后需同步到 ./nginx/conf/certs/(供本地 nginx/ 测试入口使用)
    ssl_certificate      /etc/nginx/certs/localhost.pem;
    ssl_certificate_key  /etc/nginx/certs/localhost-key.pem;

    # ---- 等保三级数据保密性:TLS 1.2/1.3 only,禁弱加密套件 ----
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                HIGH:!aNULL:!MD5:!DES:!3DES:!RC4;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        10m;

    # ---- HSTS(等保三级数据保密性:HTTPS 强制有效期≥1 年)----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- CORS:HTTPS 下 Chromium 强制 CORS 校验(同源也要),无 ACAO 头会导致模块加载失败 ----
    # 2026-08-08 本地 HTTPS 测试首次踩坑,补齐;Docker 版同步
    add_header Access-Control-Allow-Origin "https://$host:$server_port" always;

    # --- 2026-08-07 新增:前端 XSS 加固 ---
    # 内容安全策略(CSP)
    # - script-src 'self' 'unsafe-inline' 'unsafe-eval':
    #   第一版保守配置,兼容 Vite dev 模式注入;生产构建后可移除 unsafe-*/eval
    # - style-src 'self' 'unsafe-inline': Vite 注入 style + 组件 scoped 样式
    # - img-src 'self' data: 后端图片 + 验证码 base64
    # - frame-src: 默认 'self';若 PortalApp 引用第三方域名,需扩展白名单(见 plan 文档 §3.3 C3)
    # - connect-src 'self': 限定 API 域
    # - object-src 'none': 禁用 plugin
    # - base-uri 'self': 防 <base> 劫持
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止 MIME 嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer 严格
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker DNS 解析器 - 支持动态解析
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 主应用 - SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 知识库页面
    location /knowledge {
        try_files $uri $uri/ /knowledge.html;
    }

    # 运维控制台（2026-08-XX 改造：接入 vue-router，独立 SPA 路由）
    # - 2026-08-08 取消独立 HTML 入口改为 App.vue 内嵌渲染
    # - 2026-08-XX 进一步改为 vue-router 路由 /ops-console，App.vue 通过 router-view 渲染
    # - SPA fallback：所有 /ops-console/* 路径回退到 index.html 由前端路由接管
    # - 鉴权链路：复用主应用 HttpOnly Cookie + fetchWithAuth 自动注入
    #   X-Requested-With / 401 refresh 重试，与主应用 /api/auth/validate
    #   会话状态保持一致，避免「独立子窗口 Cookie 失效拉不到数据」的反模式
    location /ops-console {
        try_files $uri $uri/ /index.html;
    }

    # 门户页面
    location /portal {
        try_files $uri $uri/ /portal.html;
    }

    # 登录页入口（承载 LoginView 唯一入口；App.vue / PortalApp.vue 都不再渲染 LoginView）
    location /login {
        try_files $uri $uri/ /login.html;
    }

    # HTML 入口禁缓存：hash 资产随构建更新，旧 HTML 若被浏览器启发式缓存会引用
    # 已删除的旧 hash 资产 → 404 → 白屏；HTML 必须每次回源校验
    # 注意：本 location 一旦出现 add_header 即不再继承 server 级安全头，需全部显式重复
    # 2026-08-12 新增:HTTPS 改造后必须显式重复 HSTS + ACAO,避免被子级 add_header 清空
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "https://$host:$server_port" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    # 2026-08-12 新增:HTTPS 改造后必须显式重复 HSTS + ACAO,避免被子级 add_header 清空
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "https://$host:$server_port" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # API 代理 - 转发到后端 preview-app 服务（容器内部端口8001）
    location /api {
        proxy_pass ${VITE_API_TARGET};
        # 2026-08-12 新增:把后端 Set-Cookie 中 host 重写为 localhost
        # 容器内后端 host 通常是 preview-app(5001)或 agents,浏览器通过 localhost:9001 访问时拿不到 cookie
        # 与本地 nginx/ 测试版(127.0.0.1:8001)同模式修复
        proxy_cookie_domain ~^[A-Za-z0-9.\-]+$ localhost;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        # 流式输出关键配置
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置 - 支持长时 LLM 生成
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ============================================================
# 2026-08-21 新增:HTTP 入口 server 块(纯 HTTP,与上方 HTTPS 块并存)
# - 主机端口映射 - 9001:80(由 docker-compose.yml 同步调整)
# - 安全头省略:HTTP 下浏览器 CSP / HSTS / ACAO 头行为差异显著,
#   且 Mixed Content 会让 HTTPS 入口策略污染;HTTP 入口保持"裸"静态 + API 代理
# - 如需"HTTP 自动升级 HTTPS",可把本块第一行 listen 80; 改为
#   return 301 https://$host:9000$request_uri; 即可生效
# ============================================================
server {
    # 2026-08-21 新增:HTTP 入口(对外 9001:80,与上方 443 ssl 块并存,不互跳转)
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 与 HTTPS 块一致(本 server 不下发任何 add_header,server 级头为空)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA fallback(与 HTTPS 块完全相同的 try_files 链)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 知识库页面
    location /knowledge {
        try_files $uri $uri/ /knowledge.html;
    }

    # 运维控制台(vue-router 路由 /ops-console,App.vue 通过 router-view 渲染)
    location /ops-console {
        try_files $uri $uri/ /index.html;
    }

    # 门户页面
    location /portal {
        try_files $uri $uri/ /portal.html;
    }

    # 登录页入口
    location /login {
        try_files $uri $uri/ /login.html;
    }

    # 注意:HTTP 入口不部署 HTML 禁缓存 / 静态资源 1y 缓存块,
    # 简化静态服务(缓存策略由用户另行决定;本轮保持简单避免引入新的 cache 头不一致风险)。
    # 若后续需要缓存,与 HTTPS 块对齐即可(同样要重复全部 add_header)。

    # API 代理 - 转发到后端 preview-app 服务(容器内部端口8001)
    location /api {
        proxy_pass ${VITE_API_TARGET};
        # 不改 proxy_cookie_domain:HTTP 入口 cookies 不带 Secure 标记即可写入,浏览器行为正常
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        # 流式输出关键配置
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置 - 支持长时 LLM 生成
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
