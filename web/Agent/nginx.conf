server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- 2026-08-07 新增:前端 XSS 加固 ---
    # 内容安全策略(CSP)
    # - script-src 'self' 'unsafe-inline' 'unsafe-eval':
    #   第一版保守配置,兼容 Vite dev 模式注入;生产构建后可移除 unsafe-*/eval
    # - style-src 'self' 'unsafe-inline': Vite 注入 style + 组件 scoped 样式
    # - img-src 'self' data: 后端图片 + 验证码 base64
    # - frame-src: 默认 'self';若 PortalApp 引用第三方域名,需扩展白名单(见 plan 文档 §3.3 C3)
    # - connect-src 'self': 限定 API 域
    # - object-src 'none': 禁用 plugin
    # - base-uri 'self': 防 <base> 劫持
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止 MIME 嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer 严格
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker DNS 解析器 - 支持动态解析
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 主应用 - SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 知识库页面
    location /knowledge {
        try_files $uri $uri/ /knowledge.html;
    }

    # 运维控制台（2026-08-XX 改造：接入 vue-router，独立 SPA 路由）
    # - 2026-08-08 取消独立 HTML 入口改为 App.vue 内嵌渲染
    # - 2026-08-XX 进一步改为 vue-router 路由 /ops-console，App.vue 通过 router-view 渲染
    # - SPA fallback：所有 /ops-console/* 路径回退到 index.html 由前端路由接管
    # - 鉴权链路：复用主应用 HttpOnly Cookie + fetchWithAuth 自动注入
    #   X-Requested-With / 401 refresh 重试，与主应用 /api/auth/validate
    #   会话状态保持一致，避免「独立子窗口 Cookie 失效拉不到数据」的反模式
    location /ops-console {
        try_files $uri $uri/ /index.html;
    }

    # 门户页面
    location /portal {
        try_files $uri $uri/ /portal.html;
    }

    # 登录页入口（承载 LoginView 唯一入口；App.vue / PortalApp.vue 都不再渲染 LoginView）
    location /login {
        try_files $uri $uri/ /login.html;
    }

    # HTML 入口禁缓存：hash 资产随构建更新，旧 HTML 若被浏览器启发式缓存会引用
    # 已删除的旧 hash 资产 → 404 → 白屏；HTML 必须每次回源校验
    # 注意：本 location 一旦出现 add_header 即不再继承 server 级安全头，需全部显式重复
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API 代理 - 转发到后端 preview-app 服务（容器内部端口8001）
    location /api {
        proxy_pass ${VITE_API_TARGET};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        
        # 流式输出关键配置
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置 - 支持长时 LLM 生成
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
