#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    # 2026-09-12 渗透整改：隐藏 nginx 版本号（响应头 + 错误页）
    server_tokens off;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # ============================================================
    # HTTP server (8080) —— 全部 301 跳转 HTTPS
    # 2026-08-08 新增:本地 HTTPS 测试入口,免去浏览器手动敲 https:// 前缀
    # 端口选择:本地非管理员环境下 80/443 为特权端口,改用 8080/8443
    # ============================================================
    server {
        listen       8080;
        server_name  localhost;

        # 关闭日志,纯跳转不打日志
        access_log off;

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }


    # ============================================================
    # HTTPS server (8443) —— 主入口,与 web/Agent/nginx.conf 同步
    # + TLS/HSTS 等保三级加固
    # 同步点(2026-08-08):
    #   - CSP / X-Frame-Options / X-Content-Type-Options / Referrer-Policy
    #   - gzip / SPA 路由(/ /knowledge /ops-console /portal /login)
    #   - 静态资源 1y 缓存 + /health 健康检查
    #   - /api 代理 → 本机后端 127.0.0.1:8001
    # Windows 差异:
    #   - 移除 Docker 专用的 resolver 127.0.0.11
    #   - ${VITE_API_TARGET} 改为写死的 127.0.0.1:8001(envsubst 仅 Docker 模板用)
    #   - 路径用正斜杠绝对路径 E:/laboratory/.../web/Agent/dist
    #   - 用 8443 替代 443 避免管理员权限需求(本地测试场景)
    # ============================================================
    server {
        listen       8443 ssl;
        server_name  localhost;

        # ---- TLS 证书(mkcert 本地 CA,免浏览器警告)----
        # Windows nginx 解析路径不稳定,改用绝对路径避免歧义
        ssl_certificate      E:/laboratory/AI/Agents/feature-agent-core-ref/nginx/conf/certs/localhost.pem;
        ssl_certificate_key  E:/laboratory/AI/Agents/feature-agent-core-ref/nginx/conf/certs/localhost-key.pem;

        # ---- 等保三级数据保密性: TLS 1.2/1.3 only, 禁弱加密套件 ----
        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                HIGH:!aNULL:!MD5:!DES:!3DES:!RC4;
        ssl_prefer_server_ciphers  on;
        ssl_session_cache          shared:SSL:10m;
        ssl_session_timeout        10m;

        # ---- HSTS(等保三级数据保密性:HTTPS 强制有效期≥1 年)----
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---- 同步 web/Agent/nginx.conf: 内容安全策略 ----
        # 2026-09-12 渗透整改：移除 unsafe-inline / unsafe-eval
        # - script-src 'self': 生产构建已无内联脚本（Vite 编译期已外联）
        # - style-src 'self' 'unsafe-inline': Vue scoped 样式动态注入仍需
        # - img-src 'self' data: 后端图片 + 验证码 base64
        # - frame-src: 默认 'self';若 PortalApp 引用第三方域名,需扩展白名单
        # - connect-src 'self': 限定 API 域(同域 HTTPS)
        # - object-src 'none': 禁用 plugin
        # - base-uri 'self': 防 <base> 劫持
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

        # 防止点击劫持
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 防止 MIME 嗅探
        add_header X-Content-Type-Options "nosniff" always;

        # Referrer 严格
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS:dist 产物中 <script type="module" crossorigin> + <link rel="modulepreload" crossorigin>
        # 在 HTTPS 下 Chromium 强制 CORS 校验(同源也要),无 ACAO 头会导致模块加载失败
        # 2026-08-08:Windows nginx 本地 HTTPS 测试首次踩坑,补齐
        add_header Access-Control-Allow-Origin "https://$host:$server_port" always;

        # 2026-09-12 渗透整改：补齐 4 个安全头（等保三级入侵防范）
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # ---- Gzip 压缩 ----
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # ---- 前端构建产物目录(直接复用 web/Agent/dist,无需同步拷贝)----
        root   E:/laboratory/AI/Agents/feature-agent-core-ref/web/Agent/dist;
        index  index.html;

        #access_log  logs/host.access.log  main;

        # ---- 健康检查 ----
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ---- 主应用 SPA 路由 ----
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 知识库页面
        location /knowledge {
            try_files $uri $uri/ /knowledge.html;
        }

        # 运维控制台(vue-router /ops-console,SPA fallback 回主入口)
        location /ops-console {
            try_files $uri $uri/ /index.html;
        }

        # 门户页面
        location /portal {
            try_files $uri $uri/ /portal.html;
        }

        # 登录页入口(承载 LoginView 唯一入口)
        location /login {
            try_files $uri $uri/ /login.html;
        }

        # ---- HTML 入口禁缓存 ----
        # hash 资产随构建更新;旧 HTML 若被浏览器启发式缓存,会引用已删除的旧 hash
        # 资产 → 404 → 白屏。HTML 必须每次回源校验,no-cache 后由 ETag/304 兜底性能。
        # 注意:本 location 一旦出现 add_header 即不再继承 server 级安全头,需全部显式重复
        # 修复 2026-08-13:此前的 `try_files $uri $uri/ /index.html` 与 SPA `location /` 块配合形成
        # "GET / → /index.html → 再次命中 .html$ → try_files 兜底 → /index.html" 的内部重定向循环
        # (nginx 默认 10 次上限,触发 *N rewrite or internal redirection cycle while internally
        # redirecting to "/index.html")。修复:HTML 文件直接命中返回,$uri 不存在则 404,
        # 不再兜底到 /index.html(避免与 SPA fallback 形成回环)。
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Access-Control-Allow-Origin "https://$host:$server_port" always;
            # 2026-09-12 渗透整改：补齐 4 个安全头
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Permitted-Cross-Domain-Policies "none" always;
            try_files $uri =404;
        }

        # 静态资源 1 年强缓存
        # 注意:此 location 内 add_header 会覆盖 server 级所有 add_header,
        # 必须把 ACAO / CSP / HSTS / X-Frame-Options 等安全头在此显式重复
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "https://$host:$server_port" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # 2026-09-12 渗透整改：补齐 4 个安全头
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Permitted-Cross-Domain-Policies "none" always;
            access_log off;
        }

        # ---- API 代理:转发到本机后端 127.0.0.1:8001 ----
        # Docker 模板原 ${VITE_API_TARGET};Windows 无 envsubst,写死即可
        # 重写 Set-Cookie Domain:后端绑 127.0.0.1 时 Set-Cookie host=127.0.0.1
        # 浏览器通过 localhost:8443 访问时拿不到该 cookie,需要把 Domain 改为 localhost
        # 2026-08-08:Windows 本地 HTTPS 测试,后端监听 127.0.0.1 → 必须改写
        location /api {
            proxy_pass http://127.0.0.1:8001;
            # 把后端 Set-Cookie 中(隐式或显式)的 Domain 127.0.0.1 重写为 localhost
            # 用正则匹配任意 host(后端可能不显式写 Domain,默认绑响应 host=127.0.0.1)
            proxy_cookie_domain ~^[A-Za-z0-9.\-]+$ localhost;
            # 2026-09-12 渗透整改：隐藏 uvicorn 的 Server 头
            proxy_hide_header Server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;

            # 流式输出关键配置(SSE)
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # WebSocket 支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时 - 支持长时 LLM 生成
            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        #error_page  404              /404.html;

        error_page   500 502 503 504  /50x.html;
        # /50x.html 由上方 location ~* \.html$ 块承接(no-cache + 安全头),
        # 修复 2026-08-13:原 error_page 改写到 /index.html 会与 SPA fallback 形成循环
        # (GET / → 500 → /index.html → 再次命中 .html$ 块 → 再次触发 try_files),
        # 改用独立的 /50x.html 兜底页。若 dist 中不存在 50x.html 文件,
        # nginx 会回落到默认 5xx 错误页,不再触发内部重定向。
        # 不再保留 location = /index.html 精确匹配块(精确匹配优先级高于正则,
        # 会绕过 .html$ 块导致 / 与 /index.html 丢失 Cache-Control 禁缓存头)
    }

}