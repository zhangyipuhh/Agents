
services:
  agents:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: agents/v1.0
    container_name: preview-app
    restart: always
    ports:
      - "8001:8001"
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
    env_file:
      - .env
    volumes:
      # ===== 新增（2026-07-09）：让 preview-app 能通过 socket 连宿主机 docker daemon =====
      # 不加这一行，容器内的 docker.DockerClient(base_url='unix:///var/run/docker.sock') 
      # 会因找不到文件/无权限而抛 DockerException，sandbox 工具永远起不了子容器。
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app/shared/tools/mcp/config.yaml:/app/app/shared/tools/mcp/config.yaml:ro
      # 数据目录挂载（2026-07-09：数据从 ./app/data 迁移至项目根 ./data 后改为整体挂载）
      - ./data:/app/data:rw
      # 代码目录挂载（开发模式）：宿主机修改代码后立即生效，无需重建镜像
      - ./app:/app/app:rw
      # 仓库根 agents/ 目录挂载（2026-07-09 新增）：
      #   agents 表的 agents_md_path 是相对路径 agents/<name>/AGENTS.md，
      #   容器 CWD=/app 下需访问 /app/agents/...；挂载到 :rw 以支持开发期
      #   修改 AGENTS.md 后立即生效，无需 docker compose build。
      - ./agents:/app/agents:rw
      # 挂载 .env 文件，让容器内 find_dotenv() 与 pydantic-settings 的 env_file 能正确读取
      - ./.env:/app/.env:ro
    mem_limit: 8g
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - agent_preview-network
  web-agent:
    build:
      context: ./web/Agent
      dockerfile: Dockerfile
    image: web-agent/v2.0
    container_name: preview-web
    restart: always
    ports:
      # 2026-08-21 双入口改造:HTTPS / HTTP 并存
      # - 9000:443 → https://localhost:9000/  (容器内 listen 443 ssl,等保三级安全加固)
      # - 9001:80  → http://localhost:9001/   (容器内 listen 80,纯 HTTP,与 HTTPS 块不互跳转)
      - "9000:443"
      - "9001:80"
    environment:
      - VITE_API_TARGET=${VITE_API_TARGET:-http://preview-app:8001}
    volumes:
      # ===== 2026-08-12 新增:复用本地 mkcert 证书,容器内启用 HTTPS =====
      # 前提:宿主机已执行 .\nginx\mkcert.exe -install(一次性)
      # 证书放置在 web/Agent/certs/(与 web/Agent/nginx.conf 同目录),而非项目根 nginx/
      # 原因:让前端 Docker 镜像的 TLS 配置自包含,不依赖项目根 nginx 工具链
      # 重新签发流程(任何时候修改 SAN 都需重签,**不限于到期**):
      #   1. mkcert 签发到 web/Agent/certs/(Docker 主路径,容器内生效):
      #      .\nginx\mkcert.exe -cert-file .\web\Agent\certs\localhost.pem -key-file .\web\Agent\certs\localhost-key.pem localhost 127.0.0.1 ::1 10.20.8.73
      #   2. 手动同步到 nginx/conf/certs/(本地 nginx/ 测试入口 nginx/conf/nginx.conf 引用此路径):
      #      Copy-Item .\web\Agent\certs\* .\nginx\conf\certs\ -Force
      #   3. 重启本地 nginx 与 docker compose(让新证书生效)
      # 证书有效期 2 年(到 2028-11-08),到期后必须重新签发
      # mkcert SAN 含 localhost/127.0.0.1/::1/10.20.8.73,浏览器通过 https://localhost:9001 访问时绿锁无警告
      - ./web/Agent/certs:/etc/nginx/certs:ro
    healthcheck:
      # 校验证书存在,避免 ./nginx/conf/certs/ 缺失时 nginx 启动后才报错(容器会无限重启)
      # 提前在 healthcheck 暴露问题
      test: ["CMD-SHELL", "test -f /etc/nginx/certs/localhost.pem && test -f /etc/nginx/certs/localhost-key.pem"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 8g
    depends_on:
      - agents
    networks:
      - agent_preview-network

# 文件顶部（与 services 平级）
networks:
  agent_preview-network:
    driver: bridge
  preview-network:
  shared-network:
    external: true
 
